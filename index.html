<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIF 학원관리로 옮겼어요</title>
<meta name="theme-color" content="#0E6B70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* 10-23부터 오늘 클리닉은 새 학원관리 앱으로. 옛 앱은 old.html에 보관 (비상용) */
  :root { --bg: #F3F5F7; --card: #FFFFFF; --ink: #17212B; --muted: #5F6B77; --line: #DCE1E6; --accent: #0E6B70; --accent-ink: #FFFFFF; --soft: #E1F0F0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0F1419; --card: #182029; --ink: #E7ECF1; --muted: #93A0AD; --line: #2A3540; --accent: #4FB6B9; --accent-ink: #0F1419; --soft: #173336; } }
  :root[data-theme="dark"] { --bg: #0F1419; --card: #182029; --ink: #E7ECF1; --muted: #93A0AD; --line: #2A3540; --accent: #4FB6B9; --accent-ink: #0F1419; --soft: #173336; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--ink); font: 16px/1.6 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; text-align: center; }
  .logo { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 21px; margin: 14px 0 6px; }
  p { margin: 6px 0; color: var(--muted); }
  .btn { display: block; margin: 20px 0 10px; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; text-decoration: none; font-size: 17px; }
  .addr { font-size: 13px; background: var(--soft); border-radius: 8px; padding: 6px 10px; word-break: break-all; color: var(--ink); }
  .small { font-size: 13px; }
  ol { text-align: left; font-size: 14px; color: var(--muted); padding-left: 20px; margin: 14px 0 0; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="icon-192.png" alt="">
  <h1>오늘 클리닉이 새 학원관리 앱으로 옮겼어요</h1>
  <p>10월 23일부터 클리닉·수업피드백·일정변경·학생명단·질문 답변은 새 앱에서 해요.</p>
  <a class="btn" id="go" href="https://academy-app.academy-app.workers.dev">새 앱 열기</a>
  <p class="small" id="count">5초 뒤 자동으로 넘어가요.</p>
  <p class="addr">academy-app.academy-app.workers.dev</p>
  <ol>
    <li>처음이면 '처음 가입' → 본인 이메일·비밀번호 → 원장님께 받은 초대 코드</li>
    <li>휴대폰은 새 앱에서 '홈 화면에 추가'를 다시 해 주세요 (이 아이콘은 지워도 돼요)</li>
  </ol>
</main>
<script>
  // 옛 앱 화면이 기기에 남지 않게 오프라인 저장을 새로 함 (sw.js v2)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var n = 5, el = document.getElementById('count');
  var t = setInterval(function () {
    n -= 1;
    if (n <= 0) { clearInterval(t); location.replace(document.getElementById('go').href); return; }
    el.textContent = n + '초 뒤 자동으로 넘어가요.';
  }, 1000);
</script>
</body>
</html>
