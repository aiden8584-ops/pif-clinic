<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>
  // 삼성 인터넷은 "앱 설치" 때 Play 프로텍트 경고가 뜰 수 있어 앱 정보(manifest)를 주지 않고 홈 화면 바로가기로만 추가 (학습실 앱과 같음)
  if (!/SamsungBrowser/i.test(navigator.userAgent)) {
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  }
</script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>PIF 오늘 클리닉</title>

<style>
/* Layout: 출석부 카드 그리드 — 상단 고정 현황줄 + 시간순 학생 카드 (폰 1열 · 태블릿 2열 · PC 3열) */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --line: #DCE1E6;
  --ink: #17212B;
  --muted: #5F6B77;
  --accent: #0E6B70;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1F0F0;
  --ok: #1E7B45;      --ok-soft: #E3F4EA;
  --warn: #A65F00;    --warn-soft: #FFF1D6;
  --bad: #B3261E;     --bad-soft: #FCE4E2;
  --done: #6B7682;    --done-soft: #ECEFF2;
  --chip-ink: #17212B;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1419; --surface: #182029; --line: #2A3540; --ink: #E7ECF1; --muted: #93A0AD;
  --accent: #4FB6B9; --accent-ink: #0F1419; --accent-soft: #173336;
  --ok: #5CC98A; --ok-soft: #173325; --warn: #F0B04A; --warn-soft: #3A2C12;
  --bad: #F08A80; --bad-soft: #3D1D1B; --done: #8E99A5; --done-soft: #222B34;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1419; --surface: #182029; --line: #2A3540; --ink: #E7ECF1; --muted: #93A0AD;
  --accent: #4FB6B9; --accent-ink: #0F1419; --accent-soft: #173336;
  --ok: #5CC98A; --ok-soft: #173325; --warn: #F0B04A; --warn-soft: #3A2C12;
  --bad: #F08A80; --bad-soft: #3D1D1B; --done: #8E99A5; --done-soft: #222B34;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.seg button:active, .btn:active, .toggle:active { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { padding-block: 10px; display: grid; gap: 10px; }
.title-row { display: flex; align-items: center; gap: 10px; }
.title-row h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.title-row .date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.title-row .sp { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sync.busy .dot { background: var(--warn); }
.sync.err .dot { background: var(--bad); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; }

.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.f { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.f b { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.f[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); }

.banner { margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
main .wrap { padding-block: 14px 40px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.empty { padding: 40px 8px; text-align: center; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.card.late { border-color: var(--warn); }
.card.cancel { opacity: .62; }
.card.gone .head { background: var(--bg); }
.card.gone .time { color: var(--muted); }
.head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; }
.head.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.head.tap:active { background: var(--bg); }
.head .hr { display: flex; align-items: center; gap: 10px; }
.chev { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; flex: none; }
.chev::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-2px) rotate(45deg); }
.chev.up::before { transform: translateY(2px) rotate(-135deg); }
.body.peek { cursor: pointer; }
.body.peek .more { font-size: 13px; color: var(--accent); white-space: nowrap; }
.time { font-family: var(--mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1; }
.who { min-width: 0; }
.name { font-weight: 700; font-size: 17px; word-break: keep-all; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--done-soft); color: var(--chip-ink); }
.chip.kind { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.s-plan { background: var(--done-soft); color: var(--muted); }
.s-start { background: var(--accent-soft); color: var(--accent); }
.s-late { background: var(--warn-soft); color: var(--warn); }
.s-in { background: var(--ok-soft); color: var(--ok); }
.s-abs { background: var(--bad-soft); color: var(--bad); }
.s-out { background: var(--done-soft); color: var(--done); }

.body { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 12px; }
.row { display: grid; gap: 6px; }
.lab { font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 40px; min-width: 56px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg.att button[data-v="출석"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.seg.att button[data-v="지각"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.seg.att button[data-v$="결석"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.seg.att5 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.seg.att5 button { grid-column: span 3; min-width: 0; }
.seg.att5 .minor { grid-column: span 2; min-height: 36px; padding: 6px 2px; font-size: 13px; letter-spacing: -0.02em; color: var(--muted); }
.todo { background: var(--accent-soft); border-radius: 9px; padding: 8px 10px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tasks { display: grid; grid-template-columns: 64px 1fr; gap: 8px 10px; align-items: center; }
.tasks .k { font-size: 13px; color: var(--muted); }
.tasks .seg button { min-height: 36px; font-size: 13.5px; min-width: 48px; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; width: 100%; text-align: left; font-size: 14px; }
.toggle .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 13px; line-height: 1; }
.toggle[aria-pressed="true"] { border-color: var(--accent); }
.toggle[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.txt { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 11px; font-size: 14.5px; }
.txt.need { border-color: var(--warn); background: var(--warn-soft); }
.saved { font-size: 11.5px; color: var(--ok); }

.act { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 auto; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 8px 14px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.btn.ghost { flex: 0 0 auto; font-weight: 500; color: var(--muted); }
.btn:disabled { opacity: .55; cursor: default; }
.note { font-size: 12.5px; color: var(--muted); }
.note.warn { color: var(--warn); }
.note.bad { color: var(--bad); }
.foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.foot .rep.warn { color: var(--warn); font-weight: 600; }
.more { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 0; }
.card.busy { position: relative; }
.card.busy::after { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: run 1s linear infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast.bad { background: var(--bad); }
.who-chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.who-chip button { border: 0; background: var(--bg); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
@media (max-width: 400px) { .title-row .date { display: none; } }
.boss { margin: 0 14px 12px; border-radius: 10px; padding: 10px 12px; background: var(--warn-soft); border: 1px solid var(--warn); display: grid; gap: 8px; }
.boss.ack { background: var(--ok-soft); border-color: var(--ok); }
.boss.blank { background: var(--bg); border-color: var(--line); }
.boss.blank .bl { color: var(--muted); }
.boss .bl { font-size: 12px; font-weight: 700; color: var(--warn); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; }
.boss.ack .bl { color: var(--ok); }
.boss .bt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; font-weight: 500; }
.boss .bbtn { justify-self: start; min-height: 38px; padding: 6px 16px; border-radius: 9px; border: 1px solid var(--warn); background: var(--surface); color: var(--warn); font-weight: 700; }
.boss textarea, .notice textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--surface); font: inherit; font-size: 14.5px; color: var(--ink); }
.notice { margin-bottom: 12px; border-radius: 12px; padding: 12px 14px; background: var(--warn-soft); border: 1px solid var(--warn); display: grid; gap: 8px; }
.notice.ack { background: var(--surface); border-color: var(--line); }
.notice .nl { font-size: 12.5px; font-weight: 700; color: var(--warn); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.notice.ack .nl { color: var(--muted); }
.notice .nt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; font-weight: 600; }
.notice .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notice .acks { font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card.busy::after { animation: none; } }

/* ---------- 입장 화면 ---------- */
.login { --hero: #0F7176; --hero-2: #083E42; --hero-glow: rgba(126, 220, 210, .35); --hero-ink: #FFFFFF; --hero-line: rgba(255,255,255,.06); --hero-sub: rgba(255,255,255,.74);
  position: relative; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; isolation: isolate;
  background: radial-gradient(60% 45% at 12% 8%, var(--hero-glow), transparent 70%),
              radial-gradient(55% 50% at 100% 100%, rgba(0,0,0,.28), transparent 70%),
              linear-gradient(165deg, var(--hero) 0%, var(--hero-2) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login { --hero: #13464A; --hero-2: #071F22; --hero-glow: rgba(110, 200, 190, .18); } }
:root[data-theme="dark"] .login { --hero: #13464A; --hero-2: #071F22; --hero-glow: rgba(110, 200, 190, .18); }
/* 배경: 학원 청록 + 출석부 줄과 여백선, 큰 PIF 윤곽 글자 */
.login::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(90deg, transparent 0 calc(8% - 1px), rgba(255,160,150,.28) calc(8% - 1px) 8%, transparent 8%),
              repeating-linear-gradient(0deg, var(--hero-line) 0 1px, transparent 1px 34px);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 60%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 60%, transparent 100%); }
.login::after { content: "PIF"; position: absolute; right: -0.08em; bottom: -0.18em; z-index: -1; pointer-events: none;
  font: 800 clamp(180px, 42vw, 420px)/1 var(--font); letter-spacing: -0.07em;
  color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.13); }
.lg { width: 100%; max-width: 420px; display: grid; gap: 20px; }
.lg-brand { display: grid; gap: 6px; padding: 0 4px; color: var(--hero-ink); }
.lg-eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--hero-sub); }
.lg-eyebrow i { width: 22px; height: 1.5px; background: currentColor; opacity: .7; }
.lg-brand h2 { margin: 0; font-size: clamp(28px, 7.4vw, 34px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; text-wrap: balance; }
.lg-brand h2 em { font-style: normal; color: #9FE6DC; }
.lg-brand .lg-sub { font-size: 14px; color: var(--hero-sub); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.lg-brand .lg-sub b { color: var(--hero-ink); font-weight: 600; }
.lg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px 20px; display: grid; gap: 18px; box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 18px 48px rgba(8,40,44,.18); }
.lg-k { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.lg-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lg-roles button { display: grid; justify-items: start; gap: 2px; padding: 14px 14px 12px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; text-align: left; transition: border-color .15s, background .15s; }
.lg-roles button:not([aria-pressed="true"]):hover { border-color: var(--muted); }
.lg-roles button { position: relative; }
.lg-roles button[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft) !important; }
.lg-roles button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.lg-roles svg { width: 26px; height: 26px; margin-bottom: 6px; color: var(--muted); }
.lg-roles b { font-size: 17px; }
.lg-roles small { font-size: 12.5px; color: var(--muted); }
.lg-roles button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lg-roles button[aria-pressed="true"] svg { color: var(--accent); }
.lg-names { display: flex; flex-wrap: wrap; gap: 6px; }
.lg-names button { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 14px 5px 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 15px; font-weight: 600; }
.lg-av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; letter-spacing: -0.02em; }
.lg-names button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lg-names button[aria-pressed="true"] .lg-av { background: var(--accent); color: var(--accent-ink); }
.lg-pw { display: grid; gap: 8px; }
.lg-pw label { font-size: 13.5px; color: var(--muted); }
.lg-pw label b { color: var(--ink); }
.lg-field { position: relative; }
.lg-field .txt { min-height: 48px; padding-right: 64px; font-size: 16px; letter-spacing: .04em; }
.lg-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 13px; padding: 8px 10px; border-radius: 8px; }
.lg-eye:hover { background: var(--bg); }
.login .err { color: var(--bad); font-size: 13.5px; margin: -6px 0 0; }
.login .err:empty { display: none; }
.lg-go { min-height: 50px; font-size: 16px; }
.lg-inst { display: grid; gap: 10px; justify-items: center; }
.lg-instbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: var(--hero-ink); border-radius: 999px; padding: 10px 18px; font-size: 14.5px; font-weight: 600; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.lg-instbtn:hover { background: rgba(255,255,255,.2); }
.lg-instbtn svg { width: 18px; height: 18px; }
.lg-howto { width: 100%; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 14px; padding: 12px 14px; color: var(--hero-ink); font-size: 14px; line-height: 1.6; }
.lg-howto b { color: #9FE6DC; }
.lg-howto .lg-instbtn { justify-content: center; width: 100%; }
.lg-howto ol { margin: 4px 0 0; padding-left: 20px; }
.lg-foot { text-align: center; font-size: 12.5px; color: var(--hero-sub); margin: 0; line-height: 1.6; }
.lg-foot b { color: var(--hero-ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .lg-roles button { transition: none; } }

/* ---------- 한눈에 보기: A 진행 요약 · B 확인할 것 · C 칸 · E 목록 ---------- */
.ov { display: grid; gap: 12px; margin-bottom: 14px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.sum-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

    function stTone(st) { return /^발송완료/.test(st) ? 'st-ok' : /^⚠️/.test(st) ? 'st-warn' : 'st-mute'; }

      if (!L.classes.length) h += '<div class="empty">오늘 수업이 있는 반이 없습니다. 반은 매일 0시에 학생명단의 수업요일로 자동으로 채워집니다.</div>';
      L.classes.forEach(function (c) {

        if (open) {
          h += '<div class="lbody"><div class="fgrid">' +
            '<label class="row wide"><span class="lab"><span>수업내용</span></span><textarea class="txt" data-lc="content" data-fk="c|' + esc(c.cls) + '|content" maxlength="1000">' + esc(c.content) + '</textarea></label>' +
            '<label class="row"><span class="lab"><span>과제부여</span></span><textarea class="txt" data-lc="assign" data-fk="c|' + esc(c.cls) + '|assign" maxlength="1000">' + esc(c.assign) + '</textarea></label>' +
            '<label class="row"><span class="lab"><span>공지사항</span><span>문자 · 학생 앱에 표시</span></span><textarea class="txt" data-lc="notice" data-fk="c|' + esc(c.cls) + '|notice" maxlength="1000" placeholder="이 반 학부모 문자에 들어갈 공지">' + esc(c.notice) + '</textarea></label>' +
            '<label class="row"><span class="lab"><span>통과기준 (점)</span></span><input class="txt" type="number" min="0" max="100" inputmode="numeric" data-lc="pass" data-fk="c|' + esc(c.cls) + '|pass" value="' + esc(c.pass) + '"></label>' +
            '<label class="row"><span class="lab"><span>발송시각</span></span><select class="txt" data-lc="sendAt" data-fk="c|' + esc(c.cls) + '|sendAt">' +
              ch.sendAt.map(function (t) { return '<option value="' + esc(t) + '"' + (t === c.sendAt ? ' selected' : '') + '>' + (t ? esc(t) : '비움 (' + esc(L.reportTime) + ')') + '</option>'; }).join('') + '</select></label>' +

        }

    }
    // ---- 한번에 입력 (비어 있는 칸만 채움) ----

      var sent = function (s) { return /^발송완료/.test(s.status); };
      var canEx = mine.filter(function (s) { return !s.excl && !sent(s) && s.att !== '결석'; }).length;

      return h;
    }
    // 지금 바로 보낼 수 있는 학생 (문자 내용 있음 · 제외 아님 · 아직 안 보냄 · 알림중지/번호 없음 아님)
    function canSend(s) { return !!s.preview && !s.excl && (s.status === '대기' || s.status === '승인 대기' || s.status === '⚠️ 발송 실패'); }

    }

    // ---- 수업피드백 학생 보기: 칸 · 목록 ----
    var LGROUPS = [['none', '출석 미입력', 'var(--warn)', function (a) { return !a; }], ['in', '출석·지각', 'var(--ok)', function (a) { return a === '출석' || a === '지각'; }],
                   ['makeup', '영상보강', 'var(--accent)', function (a) { return a === '영상보강'; }], ['abs', '결석', 'var(--bad)', function (a) { return a === '결석'; }]];
    function sKey(s) { return s.cls + '|' + s.name + '|' + s.row; }
    function sAttrs(s) { return ' data-row="' + s.row + '" data-name="' + esc(s.name) + '" data-cls="' + esc(s.cls) + '" data-sk="' + esc(sKey(s)) + '"'; }
    function lStatusPill(s) {

    }
    function lAbsentBtn(s) {
      if (s.att) return '';
      if (s.absent === 'wait') return '<button class="nbtn wait" type="button" data-la="absent-off">발송 대기 · 취소</button>';
      if (s.absent === 'sent') return '<span class="nbtn done">✓ 알림 보냄</span>';
      return '<button class="nbtn" type="button" data-la="absent-on">✉ 미도착 알림 보내기</button>';
    }
    function lBoardHTML(mine) {
      return '<div class="board" style="padding:0 14px 14px;grid-template-columns:repeat(4,minmax(180px,1fr))">' + LGROUPS.map(function (g) {
        var list = mine.filter(function (s) { return g[3](s.att); });
        return '<div class="bcol"><h3><i style="background:' + g[2] + '"></i>' + g[1] + '<span>' + list.length + '</span></h3>' + list.map(function (s) {
          var bits = [];
          if (s.hw) bits.push('과제 ' + s.hw); if (s.score !== '') bits.push(s.score + '점' + (s.pass ? ' ' + s.pass : '')); if (s.atti) bits.push('태도 ' + s.atti);
          return '<div class="tk lst-tk" role="button" tabindex="0"' + sAttrs(s) + '><span class="r1">' + selBox(s) + '<b>' + esc(s.name) + '</b></span>' +
            '<span class="r2">' + lStatusPill(s) + (bits.length ? '<span>' + esc(bits.join(' · ')) + '</span>' : '') + (s.excl ? '<span class="flag">발송 제외</span>' : '') + '</span>' +
            lAbsentBtn(s) + '</div>';
        }).join('') + '</div>';
      }).join('') + '</div>';
    }
    function lListHTML(mine) {
      if (!mine.length) return '';
      return '<div style="padding:0 14px 14px"><div class="ltb"><table><thead><tr><th style="width:44px"></th><th>이름</th><th>출석</th><th>과제</th><th>리뷰</th><th>재시험</th><th>태도</th><th>문자</th><th></th></tr></thead><tbody>' +
        mine.map(function (s) {
          return '<tr class="lst-tk' + (!s.att ? ' hl' : '') + '"' + sAttrs(s) + '><td>' + selBox(s) + '</td><td><b>' + esc(s.name) + '</b></td>' +
            '<td>' + (s.att ? '<span class="pill ' + (s.att === '결석' ? 's-abs' : s.att === '영상보강' ? 's-start' : s.att === '지각' ? 's-late' : 's-in') + '">' + esc(s.att) + '</span>' : '<span class="st-mute">—</span>') + '</td>' +
            '<td>' + esc(s.hw || '—') + '</td><td class="mono">' + (s.score !== '' ? esc(s.score) + '점 ' + (s.pass ? '<span class="st-mute">' + esc(s.pass) + '</span>' : '') : '—') + '</td>' +
            '<td>' + esc(s.retest || '—') + '</td><td>' + esc(s.atti || '—') + (s.cmt ? ' <span class="st-mute">💬</span>' : '') + '</td>' +
            '<td>' + lStatusPill(s) + (s.excl ? ' <span class="st-mute">제외</span>' : '') + '</td><td>' + lAbsentBtn(s) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    function lSheetHTML() {
      if (V.llay === 'card' || !V.lsheet) return '';
      var s = V.L.students.filter(function (x) { return sKey(x) === V.lsheet; })[0];
      if (!s) { V.lsheet = null; return ''; }
      var mates = V.L.students.filter(function (x) { return x.cls === s.cls; }), i = mates.indexOf(s);
      var tone = /^발송완료/.test(s.status) ? 's-in' : /^⚠️/.test(s.status) ? 's-late' : /^제외/.test(s.status) ? 's-out' : 's-plan';
      var att = s.att ? '<span class="pill ' + (s.att === '결석' ? 's-abs' : s.att === '영상보강' ? 's-start' : s.att === '지각' ? 's-late' : 's-in') + '">' + esc(s.att) + '</span>' : '<span class="pill s-plan">출석 미입력</span>';
      return popHTML({
        bg: 'data-lsheet-bg', close: 'data-lclose', nav: 'data-lnav',
        name: s.name, sub: '<span class="chip">' + esc(s.cls) + '</span>' + att + '<span class="pill ' + tone + '">문자 ' + esc(s.status || '—') + '</span>',
        body: stuHTML(s).replace('class="lstu', 'class="lstu insheet').replace('<details class="pv"', '<details class="pv" open'),
        i: i, n: mates.length, prev: i > 0 ? mates[i - 1].name : '', next: i < mates.length - 1 ? mates[i + 1].name : ''
      });
    }
    $('view-lesson').addEventListener('click', function (ev) {
      var nb = ev.target.closest('[data-lnav]'); if (!nb || nb.disabled) return;
      var s = V.L.students.filter(function (x) { return sKey(x) === V.lsheet; })[0]; if (!s) return;
      var mates = V.L.students.filter(function (x) { return x.cls === s.cls; }), t = mates[mates.indexOf(s) + Number(nb.dataset.lnav)];
      if (t) { V.lsheet = sKey(t); drawLesson(); }
      ev.stopPropagation();
    }, true);
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && V.lsheet) { V.lsheet = null; drawLesson(); } });

    function stuHTML(s) {
      var ch = V.L.choices, k = s.cls + '|' + s.name;
      var off = s.excl || s.att === '결석';
      var h = '<article class="lstu' + (off ? ' off' : '') + '" data-row="' + s.row + '" data-name="' + esc(s.name) + '" data-cls="' + esc(s.cls) + '">';
      h += '<div class="h">' + selBox(s) + '<span class="name"><b>' + esc(s.name) + '</b></span><span class="pill ' +
        (/^발송완료/.test(s.status) ? 's-in' : /^⚠️/.test(s.status) ? 's-late' : /^제외/.test(s.status) ? 's-out' : 's-plan') + '">' + esc(s.status || '—') + '</span></div>';

        else if (s.absent === 'sent') h += '<p class="note">' + esc(s.absentNote) + '</p>';
        else h += '<div class="act"><button class="btn" type="button" data-la="absent-on">미도착 알림 보내기 (학생·학부모)</button></div>' + (s.absent === 'fail' ? '<p class="note bad">' + esc(s.absentNote) + '</p>' : '');
      }

      if (s.preview) h += '<details class="pv" data-fk="pv|' + esc(k) + '"><summary>학부모 문자 미리보기 ▾</summary><div class="preview">' + esc(s.preview) + '</div></details>';
      if (s.preview && !s.excl && (s.status === '대기' || s.status === '승인 대기' || s.status === '⚠️ 발송 실패'))
        h += '<button class="btn sendone" type="button" data-la="sendone">✉ 이 학생만 지금 보내기</button>';
      else if (/^발송완료/.test(s.status)) h += '<p class="note" style="color:var(--ok);margin:0">✓ ' + esc(s.status) + '</p>';

    }
    // 저장이 줄 서 있는 동안 도착한 중간 결과로 화면을 덮지 않음 (빠르게 여러 명 누를 때 앞서 누른 것이 되돌아가는 문제 방지)
    function lessonSet(res) { var d = res && res.data ? res.data : res; if (d && !pending) { V.L = d; drawLesson(); } if (res && res.msg) toast(res.msg); }
    $('view-lesson').addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (ev.target.closest && ev.target.closest('.selbox')) return;   // 고르기 칸은 change에서 처리 (카드 열기 X)
      if (ev.target.hasAttribute && ev.target.hasAttribute('data-lsheet-bg')) { V.lsheet = null; drawLesson(); return; }
      if (b && b.dataset.selclear) { Object.keys(V.lsel).forEach(function (k) { if (k.indexOf(clsOf(b.closest('.lcls')).cls + '|') === 0) delete V.lsel[k]; }); drawLesson(); return; }
      if (b && b.dataset.selall) { var sc = clsOf(b.closest('.lcls')); V.L.students.forEach(function (s) { if (s.cls === sc.cls && canSend(s)) V.lsel[sKey(s)] = 1; }); drawLesson(); return; }
      if (b && b.dataset.selsend) {
        var qc = clsOf(b.closest('.lcls'));
        var pick = V.L.students.filter(function (s) { return s.cls === qc.cls && canSend(s) && V.lsel[sKey(s)]; });
        if (!pick.length) return;
        if (!sure(b, pick.length + '명에게 지금 보냅니다. 한 번 더 누르세요', 4000)) return;
        b.disabled = true;
        pick.forEach(function (s) { delete V.lsel[sKey(s)]; });
        run('apiLessonSendMany', [pick.map(function (s) { return { row: s.row, name: s.name, cls: s.cls }; })], lessonSet);
        return;
      }
      if (b && b.hasAttribute('data-lclose')) { V.lsheet = null; drawLesson(); return; }
      if (b && b.dataset.exall) {
        var ec = clsOf(b.closest('.lcls')), on = b.dataset.exall === '1';
        if (!sure(b, on ? '한 번 더 누르면 모두 안 보냄' : '한 번 더 누르면 모두 보내기로')) return;
        b.disabled = true;
        V.L.students.forEach(function (s) { if (s.cls === ec.cls && !/^발송완료/.test(s.status) && (on ? s.att !== '결석' : true)) s.excl = on; });
        drawLesson();
        run('apiLessonExclAll', [ec.cls, on], lessonSet);

            '<td>' + (r.flag ? '<span class="pill s-abs">' + esc(r.flag) + '</span>' : (r.makeup >= lim - 1 || r.change >= lim - 1) ? '<span class="pill s-late">주의</span>' : '<span class="pill s-in">정상</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      if (!list.length) h += '<div class="empty">해당하는 학생이 없습니다.</div>';

      h += '<div class="sect" style="margin-top:28px">내신대비 기간</div><p class="note" style="margin:-4px 0 10px">학원 내신대비 시작일 ~ 학교 시험 시작일. 바꾸면 규정현황 집계 기간과 학습실 앱의 신청 한도가 함께 바뀝니다.</p><div class="egrid">' +
        RU.exams.map(function (e) {
          var n = days(e.from, e.to);
          return '<div class="panel ecard" data-idx="' + e.idx + '"><b>' + esc(e.label) + '</b><div class="two">' +
            '<label class="row"><span class="lab"><span>내신대비 시작</span></span><input class="txt" type="date" data-ex="from" value="' + esc(e.from) + '"></label>' +
            '<label class="row"><span class="lab"><span>학교 시험 시작</span></span><input class="txt" type="date" data-ex="to" value="' + esc(e.to) + '"></label></div>' +
            '<span class="dur">' + (n > 0 ? n + '일 (' + Math.round(n / 7) + '주)' : '날짜를 넣으면 이 기간만 집계합니다') + '</span></div>';
        }).join('') + '</div>';

      h += '<div class="sect" style="margin-top:28px">반별 정규 수업 시간표</div><p class="note" style="margin:-4px 0 10px">수업 미도착 알림 기준 시간입니다. 시간을 비우면 그 반은 수업 미도착 알림을 보내지 않습니다.</p>' +
        '<div class="panel tablewrap"><table class="t" style="min-width:420px"><thead><tr><th>반</th><th>수업요일</th><th>시작시간</th></tr></thead><tbody>' +
        RU.sched.map(function (s) {
          return '<tr data-idx="' + s.idx + '"><td><b>' + esc(s.cls) + '</b></td><td><select class="txt" data-sc="day" style="width:110px">' + opts(RU.choices.day, s.day, '모든 요일') + '</select></td>' +
            '<td><select class="txt" data-sc="time" style="width:120px">' + opts(RU.choices.time, s.time, '없음') + '</select></td></tr>';
        }).join('') + '</tbody></table></div>';
      paint($('view-rule'), h);
    }
    function ruleSet(d) { if (d) { V.RU = d; drawRule(); toast('저장했습니다.'); } }
    $('view-rule').addEventListener('click', function (ev) { if (ev.target.closest('#ruleWarn')) { V.ruleWarn = !V.ruleWarn; drawRule(); } });
    $('view-rule').addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.dataset.ex) run('apiSettingsSave', ['exam', +t.closest('.ecard').dataset.idx, t.dataset.ex, t.value], ruleSet);
      if (t.dataset.sc) run('apiSettingsSave', ['sched', +t.closest('tr').dataset.idx, t.dataset.sc, t.value], ruleSet);
    });

    // =========================== 성취도 문자 최종 검토 ===========================
    function repCount() {
      var n = V.RP ? V.RP.rows.filter(function (r) { return /^⚠️/.test(r.status); }).length : 0;
      $('repCnt').textContent = n; $('repCnt').hidden = !n;
    }
    function repGroup(r) {
      if (/^발송완료/.test(r.status)) return 'sent';
      if (/^⚠️/.test(r.status)) return 'warn';
      if (r.status === '대기') return 'wait';
      return 'skip';
    }
    function drawReport() {
      var P = V.RP, h = '';
      repCount();
      var g = { warn: [], wait: [], sent: [], skip: [] };
      P.rows.forEach(function (r) { g[repGroup(r)].push(r); });
      h += '<div class="vhead"><span class="sub">오늘 클리닉 학부모 성취도 문자 · ' + (P.autoSent ? '오늘 자동 발송은 이미 실행됨' : esc(P.reportTime) + '에 \'대기\' 학생 자동 발송') + '</span>' +
        '<span class="act"><button class="btn warn" type="button" data-pa="send"' + (g.wait.length ? '' : ' disabled') + '>대기 ' + g.wait.length + '명 지금 발송</button></span></div>';
      h += '<div class="nums" style="margin-bottom:14px">' + [['warn', '확인 필요', 'var(--warn)'], ['wait', '발송 대기', 'var(--accent)'], ['sent', '발송 완료', 'var(--ok)'], ['skip', '제외·해당 없음', 'var(--muted)']].map(function (x) {
        return '<div class="num" style="cursor:default"><b>' + g[x[0]].length + '</b><span><i style="background:' + x[2] + '"></i>' + x[1] + '</span></div>';
      }).join('') + '</div>';
      [['warn', '⚠️ 확인 필요 — 이대로는 발송되지 않습니다'], ['wait', '발송 대기'], ['sent', '발송 완료'], ['skip', '제외 · 해당 없음']].forEach(function (sec) {
        var list = g[sec[0]]; if (!list.length) return;
        h += '<div class="sect">' + sec[1] + ' <span style="font-family:var(--mono)">' + list.length + '</span></div><div class="panel">' + list.map(function (r) {
          var needR = r.status === '⚠️ 사유 미입력';
          return '<div class="req" data-row="' + r.row + '" data-name="' + esc(r.name) + '"><div class="rt"><b>' + esc(r.name) + '</b><span class="chip">' + esc(r.cls) + '</span>' +
            '<span class="pill ' + (sec[0] === 'warn' ? 's-late' : sec[0] === 'sent' ? 's-in' : sec[0] === 'wait' ? 's-start' : 's-out') + '">' + esc(r.status || (r.att ? r.att : '기록 없음')) + '</span>' +
            '<span class="small">' + esc([r.att, r.out ? r.out + ' 하원' : '', r.wb ? '워크북 ' + r.wb : '', r.extra ? '실전 ' + r.extra : '', r.retest ? '재시 ' + r.retest : ''].filter(Boolean).join(' · ')) + '</span></div>' +
            (needR || (r.special && sec[0] !== 'sent') ? '<label class="row"><span class="lab"><span>미완 사유 (문자에 들어감)</span></span><input class="txt' + (needR ? ' need' : '') + '" data-reason data-fk="rr|' + esc(r.name) + '" value="' + esc(r.special) + '" placeholder="예: 시간 부족, 컨디션 난조" maxlength="300"></label>' : '') +
            (r.text ? '<details class="pv" data-fk="rp|' + esc(r.name) + '"><summary>문자 내용 보기 ▾</summary><div class="preview">' + esc(r.text) + '</div></details>' : '') +
            (sec[0] !== 'sent' && (r.att === '출석' || r.att === '지각') ? '<div><button class="toggle" type="button" data-pa="excl" aria-pressed="' + !!r.excl + '" style="max-width:260px"><span class="box">' + (r.excl ? '✓' : '') + '</span>이 학생은 보내지 않기</button></div>' : '') +
            '</div>';
        }).join('') + '</div>';
      });
      if (!P.rows.length) h += '<div class="empty">오늘 클리닉 학생이 없습니다.</div>';
      paint($('view-report'), h);
    }
    function repSet(res) { var d = res && res.data ? res.data : res; if (d && !pending) { V.RP = d; drawReport(); } if (res && res.msg) toast(res.msg); }
    $('view-report').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-pa]'); if (!b || b.disabled) return;
      if (b.dataset.pa === 'send') { if (!sure(b, '한 번 더 누르면 지금 발송합니다')) return; run('apiReportSendNow', [], repSet); return; }
      var box = b.closest('.req'), row = +box.dataset.row, name = box.dataset.name;
      if (b.dataset.pa === 'excl') { var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); run('apiReportExclude', [row, name, on], repSet); }
    });
    $('view-report').addEventListener('focusout', function (ev) {
      var t = ev.target; if (!t.hasAttribute || !t.hasAttribute('data-reason')) return;
      var box = t.closest('.req'), r = V.RP.rows.filter(function (x) { return x.row === +box.dataset.row && x.name === box.dataset.name; })[0];
      if (!r || (r.special || '') === t.value.trim()) return;
      r.special = t.value.trim();
      run('apiReportReason', [r.row, r.name, r.special], repSet);
    });
    $('view-report').addEventListener('keydown', function (ev) { if (ev.isComposing || ev.keyCode === 229) return; if (ev.key === 'Enter' && ev.target.hasAttribute('data-reason')) { ev.preventDefault(); ev.target.blur(); } });

    // =========================== 학생 공지 (학생·학부모 앱) ===========================
    function nBlank() { return { row: 0, target: '전체', who: '전체', title: '', body: '', pinned: false, pub: true }; }
    function drawNotice() {
      var N = V.NT, h = '';
      h += '<div class="vhead"><span class="sub">학생·학부모 앱(학습실) 공지 · 저장하면 바로 앱에 보입니다</span>' +
        '<span class="act"><button class="btn primary" type="button" data-nn="new">＋ 새 공지 쓰기</button></span></div>';
      if (V.nedit) {
        var e = V.nedit, tg = String(e.target || '전체').split(',');
        h += '<form class="panel rform" id="nform"><h3>' + (e.row ? '공지 고치기' : '새 공지') + '</h3>' +
          '<div class="row"><span class="lab"><span>누구에게</span><span>여러 개 고를 수 있음</span></span><div class="items" id="ntg">' +
          N.targets.map(function (t) { return '<button type="button" data-ntg="' + esc(t) + '" aria-pressed="' + (tg.indexOf(t) >= 0) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>' +
          '<div class="row"><span class="lab"><span>보는 사람</span></span><div class="seg" id="nwho">' +
          N.whos.map(function (w) { return '<button type="button" data-nwho="' + esc(w) + '" aria-pressed="' + (e.who === w) + '">' + esc(w) + '</button>'; }).join('') + '</div></div>' +
          '<label class="row"><span class="lab"><span>제목</span></span><input class="txt" id="ntitle" data-fk="n|title" maxlength="100" value="' + esc(e.title) + '" placeholder="예: 11월 내신대비 일정 안내"></label>' +
          '<label class="row"><span class="lab"><span>내용</span></span><textarea class="txt" id="nbody" data-fk="n|body" maxlength="2000" style="min-height:140px" placeholder="학생·학부모 앱에 그대로 보입니다">' + esc(e.body) + '</textarea></label>' +
          '<div style="display:flex;gap:18px;flex-wrap:wrap"><label class="chk"><input type="checkbox" id="npin"' + (e.pinned ? ' checked' : '') + '> 맨 위에 고정</label>' +
          '<label class="chk"><input type="checkbox" id="npub"' + (e.pub !== false ? ' checked' : '') + '> 공개 (끄면 앱에서 숨김)</label></div>' +
          '<div class="act"><button class="btn ghost" type="button" data-nn="cancel">닫기</button><button class="btn primary" type="submit">' + (e.row ? '저장' : '게시하기') + '</button></div></form>';
      }
      h += '<div class="sect">공지 ' + N.rows.length + '건</div>';
      h += N.rows.length ? '<div class="panel">' + N.rows.map(function (n) {
        return '<div class="req ncard' + (n.pub ? '' : ' off') + '" data-row="' + n.row + '"><div class="rt">' + (n.pinned ? '<span class="pill s-start">📌 고정</span>' : '') +
          '<b>' + esc(n.title) + '</b>' + (n.pub ? '' : '<span class="pill s-out">비공개</span>') + '</div>' +
          '<div class="small">' + esc(n.date) + ' · ' + esc(n.target) + ' · ' + esc(n.who) + '</div>' +
          '<div class="why" style="white-space:pre-wrap">' + esc(n.body.length > 160 ? n.body.slice(0, 160) + '…' : n.body) + '</div>' +
          '<div class="act" style="max-width:none"><button class="btn ghost" type="button" data-nn="edit">고치기</button>' +
          '<button class="btn ghost" type="button" data-nn="pin">' + (n.pinned ? '고정 풀기' : '맨 위 고정') + '</button>' +
          '<button class="btn ghost" type="button" data-nn="pub">' + (n.pub ? '숨기기' : '다시 공개') + '</button></div></div>';
      }).join('') + '</div>' : '<div class="panel"><div class="empty">아직 공지가 없습니다. [＋ 새 공지 쓰기]로 시작하세요.</div></div>';
      paint($('view-notice'), h);
    }
    function ntSet(res) { var d = res && res.data ? res.data : res; if (d && !pending) { V.NT = d; drawNotice(); } if (res && res.msg) toast(res.msg); }
    function nRead() {
      var e = V.nedit; if (!e) return null;
      var t = $('ntitle'), b = $('nbody');
      if (t) e.title = t.value; if (b) e.body = b.value;
      if ($('npin')) e.pinned = $('npin').checked; if ($('npub')) e.pub = $('npub').checked;
      return e;
    }
    $('view-notice').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.ntg != null) {
        var e = nRead(), t = b.dataset.ntg, list = String(e.target || '').split(',').filter(Boolean);
        if (t === '전체') list = ['전체'];
        else { list = list.filter(function (x) { return x !== '전체'; }); var i = list.indexOf(t); if (i >= 0) list.splice(i, 1); else list.push(t); if (!list.length) list = ['전체']; }
        e.target = list.join(','); drawNotice(); return;
      }
      if (b.dataset.nwho) { var e2 = nRead(); e2.who = b.dataset.nwho; drawNotice(); return; }
      var a = b.dataset.nn; if (!a) return;
      if (a === 'new') { V.nedit = nBlank(); drawNotice(); window.scrollTo(0, 0); setTimeout(function () { var t = $('ntitle'); if (t) t.focus(); }, 50); return; }
      if (a === 'cancel') { V.nedit = null; drawNotice(); return; }
      var row = +b.closest('.ncard').dataset.row, n = V.NT.rows.filter(function (x) { return x.row === row; })[0]; if (!n) return;
      if (a === 'edit') { V.nedit = Object.assign({}, n); drawNotice(); window.scrollTo(0, 0); return; }
      var d = Object.assign({}, n);
      if (a === 'pin') d.pinned = !n.pinned;
      if (a === 'pub') { if (n.pub && !sure(b, '한 번 더 누르면 숨김')) return; d.pub = !n.pub; }
      b.disabled = true;
      run('apiNoticeSave', [n.row, d, n.title], ntSet);
    });
    $('view-notice').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var e = nRead();
      if (!e.title.trim()) { toast('제목을 입력해 주세요.', true); return; }
      if (!e.body.trim()) { toast('내용을 입력해 주세요.', true); return; }
      var orig = e.row ? (V.NT.rows.filter(function (x) { return x.row === e.row; })[0] || {}).title : '';
      var btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
      run('apiNoticeSave', [e.row || 0, e, orig || ''], function (res) {
        if (!res) { btn.disabled = false; return; }
        V.nedit = null; ntSet(res);
      });
    });

    // =========================== 주간 현황 ===========================
    function pct(a, b) { return b ? Math.round(a / b * 100) : null; }
    function rate(a, b, low) {
      var p = pct(a, b); if (p == null) return '<span class="st-mute">—</span>';
      return '<span class="' + (p < low ? 'st-warn' : '') + '" style="font-family:var(--mono)">' + p + '%</span> <span class="st-mute" style="font-size:12px">' + a + '/' + b + '</span>';
    }
    function drawWeek() {
      var W = V.WK, h = '';
      h += '<div class="vhead"><span class="lay" role="group" aria-label="주 선택">' + [[0, '이번 주'], [1, '지난 주'], [2, '2주 전'], [3, '3주 전']].map(function (x) {
        return '<button type="button" data-wk="' + x[0] + '" aria-pressed="' + ((V.wk || 0) === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</span>' +
        '<span class="sub">' + mdw(W.from) + ' ~ ' + mdw(W.to) + ' · 학생 ' + W.rows.length + '명</span></div>';
      var flags = W.rows.filter(function (r) { return r.absent > 0 || (pct(r.wbDone, r.wbAll) != null && pct(r.wbDone, r.wbAll) < 70) || (r.avg != null && r.lPass < r.scoreN); });
      h += '<p class="note" style="margin:0 0 10px">주의 학생 ' + flags.length + '명 — 무단결석, 워크북 완료 70% 미만, 리뷰 미통과가 있으면 노란 줄로 표시합니다.</p>';
      h += '<div class="panel tablewrap"><table class="t"><thead><tr><th>표시명</th><th>반</th><th>클리닉 출석</th><th>지각</th><th>무단결석</th><th>워크북 완료</th><th>실전 완료</th><th>재시 통과</th><th>수업 출석</th><th>리뷰 평균</th><th>리뷰 통과</th><th>수업 과제 완료</th></tr></thead><tbody>' +
        W.rows.map(function (r) {
          var warn = flags.indexOf(r) !== -1;
          return '<tr' + (warn ? ' class="hl"' : '') + '><td><b>' + esc(r.name) + '</b></td><td>' + esc(r.cls) + '</td>' +
            '<td class="num">' + (r.clinic ? r.att + '/' + r.clinic : '—') + '</td><td class="num">' + (r.late || '') + '</td>' +
            '<td class="num">' + (r.absent ? '<span class="st-warn" style="color:var(--bad);font-weight:700">' + r.absent + '</span>' : '') + (r.excused ? ' <span class="st-mute">(사유 ' + r.excused + ')</span>' : '') + '</td>' +
            '<td>' + rate(r.wbDone, r.wbAll, 70) + '</td><td>' + rate(r.exDone, r.exAll, 70) + '</td><td>' + rate(r.rtPass, r.rtAll, 100) + '</td>' +
            '<td class="num">' + (r.lesson ? r.lAtt + '/' + r.lesson + (r.makeup ? ' <span class="st-mute">보강 ' + r.makeup + '</span>' : '') : '—') + '</td>' +
            '<td class="num">' + (r.avg != null ? r.avg + '점' : '—') + '</td><td>' + rate(r.lPass, r.scoreN, 100) + '</td><td>' + rate(r.hwDone, r.hwAll, 70) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      if (!W.rows.length) h += '<div class="empty">이 주에는 기록이 없습니다.</div>';
      paint($('view-week'), h);
    }
    $('view-week').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-wk]'); if (!b) return;
      V.wk = +b.dataset.wk; V.WK = null; reload();
    });

    // 변경신청 대기 건수는 원장 로그인 시 한 번 미리 확인 (탭 옆 숫자)
    var reqPeek = false;
    window.PIFADM = {
      view: function () { return V.view; },
      reload: reload,
      tabs: function () {
        tabs();
        if (auth.admin && !reqPeek) {
          reqPeek = true;
          call('apiReqList').then(function (d) { V.Q = V.Q || d; reqCount(); }).catch(function () {});
          call('apiReportList').then(function (d) { V.RP = V.RP || d; repCount(); }).catch(function () {});
        }
      },
      reset: function () {
        V.loaded = {}; V.L = V.Q = V.RO = V.RU = V.RP = V.WK = V.NT = null; V.nedit = null; V.edit = null; reqPeek = false;
        VIEWS.forEach(function (k) { if (k !== 'today') $('view-' + k).innerHTML = ''; });
        $('tabs').hidden = true; $('reqCnt').hidden = true; $('repCnt').hidden = true;
        V.view = 'today';
        VIEWS.forEach(function (k) { $('view-' + k).hidden = k !== 'today'; });
        $('todayTools').style.display = 'grid'; $('vtitle').textContent = TITLES.today;
      }
    };
    if (V.view !== 'today') {   // 처음 열 때 지난번 탭은 원장 확인 후 복원
      var want = V.view; V.view = 'today';
      var wait = setInterval(function () { if (auth.admin) { clearInterval(wait); show(want); } }, 300);
      setTimeout(function () { clearInterval(wait); }, 15000);
    }
  })();

  if (auth.token) { showApp(); load(true); } else showLogin();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
