<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B70">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230E6B70%22/%3E%3Cpath d=%22M9 16.5l4.5 4.5L23 11%22 stroke=%22white%22 stroke-width=%223.2%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>PIF 오늘 클리닉</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 출석부 카드 그리드 — 상단 고정 현황줄 + 시간순 학생 카드 (폰 1열 · 태블릿 2열 · PC 3열) */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --line: #DCE1E6;
  --ink: #17212B;
  --muted: #5F6B77;
  --accent: #0E6B70;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1F0F0;
  --ok: #1E7B45;      --ok-soft: #E3F4EA;
  --warn: #A65F00;    --warn-soft: #FFF1D6;
  --bad: #B3261E;     --bad-soft: #FCE4E2;
  --done: #6B7682;    --done-soft: #ECEFF2;
  --chip-ink: #17212B;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1419; --surface: #182029; --line: #2A3540; --ink: #E7ECF1; --muted: #93A0AD;
  --accent: #4FB6B9; --accent-ink: #0F1419; --accent-soft: #173336;
  --ok: #5CC98A; --ok-soft: #173325; --warn: #F0B04A; --warn-soft: #3A2C12;
  --bad: #F08A80; --bad-soft: #3D1D1B; --done: #8E99A5; --done-soft: #222B34;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1419; --surface: #182029; --line: #2A3540; --ink: #E7ECF1; --muted: #93A0AD;
  --accent: #4FB6B9; --accent-ink: #0F1419; --accent-soft: #173336;
  --ok: #5CC98A; --ok-soft: #173325; --warn: #F0B04A; --warn-soft: #3A2C12;
  --bad: #F08A80; --bad-soft: #3D1D1B; --done: #8E99A5; --done-soft: #222B34;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.seg button:active, .btn:active, .toggle:active { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { padding-block: 10px; display: grid; gap: 10px; }
.title-row { display: flex; align-items: center; gap: 10px; }
.title-row h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.title-row .date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.title-row .sp { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sync.busy .dot { background: var(--warn); }
.sync.err .dot { background: var(--bad); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; }

.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.f { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.f b { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.f[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); }

.banner { margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
main .wrap { padding-block: 14px 40px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.empty { padding: 40px 8px; text-align: center; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.card.late { border-color: var(--warn); }
.card.cancel, .card.gone { opacity: .62; }
.head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; }
.time { font-family: var(--mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1; }
.who { min-width: 0; }
.name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--done-soft); color: var(--chip-ink); }
.chip.kind { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.s-plan { background: var(--done-soft); color: var(--muted); }
.s-start { background: var(--accent-soft); color: var(--accent); }
.s-late { background: var(--warn-soft); color: var(--warn); }
.s-in { background: var(--ok-soft); color: var(--ok); }
.s-abs { background: var(--bad-soft); color: var(--bad); }
.s-out { background: var(--done-soft); color: var(--done); }

.body { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 12px; }
.row { display: grid; gap: 6px; }
.lab { font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 40px; min-width: 56px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg.att button[data-v="출석"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.seg.att button[data-v="지각"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.seg.att button[data-v$="결석"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.seg.att .minor { flex: 0 1 auto; font-size: 13px; color: var(--muted); }
.todo { background: var(--accent-soft); border-radius: 9px; padding: 8px 10px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tasks { display: grid; grid-template-columns: 64px 1fr; gap: 8px 10px; align-items: center; }
.tasks .k { font-size: 13px; color: var(--muted); }
.tasks .seg button { min-height: 36px; font-size: 13.5px; min-width: 48px; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; width: 100%; text-align: left; font-size: 14px; }
.toggle .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 13px; line-height: 1; }
.toggle[aria-pressed="true"] { border-color: var(--accent); }
.toggle[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.txt { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 11px; font-size: 14.5px; }
.txt.need { border-color: var(--warn); background: var(--warn-soft); }
.saved { font-size: 11.5px; color: var(--ok); }

.act { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 auto; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 8px 14px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.btn.ghost { flex: 0 0 auto; font-weight: 500; color: var(--muted); }
.btn:disabled { opacity: .55; cursor: default; }
.note { font-size: 12.5px; color: var(--muted); }
.note.warn { color: var(--warn); }
.note.bad { color: var(--bad); }
.foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.foot .rep.warn { color: var(--warn); font-weight: 600; }
.more { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 0; }
.card.busy { position: relative; }
.card.busy::after { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: run 1s linear infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast.bad { background: var(--bad); }
.who-chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.who-chip button { border: 0; background: var(--bg); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
@media (max-width: 400px) { .title-row .date { display: none; } }
.boss { margin: 0 14px 12px; border-radius: 10px; padding: 10px 12px; background: var(--warn-soft); border: 1px solid var(--warn); display: grid; gap: 8px; }
.boss.ack { background: var(--ok-soft); border-color: var(--ok); }
.boss.blank { background: var(--bg); border-color: var(--line); }
.boss.blank .bl { color: var(--muted); }
.boss .bl { font-size: 12px; font-weight: 700; color: var(--warn); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; }
.boss.ack .bl { color: var(--ok); }
.boss .bt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; font-weight: 500; }
.boss .bbtn { justify-self: start; min-height: 38px; padding: 6px 16px; border-radius: 9px; border: 1px solid var(--warn); background: var(--surface); color: var(--warn); font-weight: 700; }
.boss textarea, .notice textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--surface); font: inherit; font-size: 14.5px; color: var(--ink); }
.notice { margin-bottom: 12px; border-radius: 12px; padding: 12px 14px; background: var(--warn-soft); border: 1px solid var(--warn); display: grid; gap: 8px; }
.notice.ack { background: var(--surface); border-color: var(--line); }
.notice .nl { font-size: 12.5px; font-weight: 700; color: var(--warn); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.notice.ack .nl { color: var(--muted); }
.notice .nt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; font-weight: 600; }
.notice .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notice .acks { font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card.busy::after { animation: none; } }

/* ---------- 입장 화면 ---------- */
.login { --hero: #0E6B70; --hero-2: #0A4F53; --hero-ink: #FFFFFF; --hero-line: rgba(255,255,255,.07); --hero-sub: rgba(255,255,255,.72);
  position: relative; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; isolation: isolate; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login { --hero: #123C3F; --hero-2: #0C2A2D; --hero-line: rgba(255,255,255,.05); } }
:root[data-theme="dark"] .login { --hero: #123C3F; --hero-2: #0C2A2D; --hero-line: rgba(255,255,255,.05); }
/* 배경: 위쪽 절반은 학원 색 + 출석부 줄무늬, 아래는 은은한 바탕 */
.login::before { content: ""; position: absolute; inset: 0 0 auto; height: 54%; z-index: -1;
  background: repeating-linear-gradient(0deg, var(--hero-line) 0 1px, transparent 1px 32px),
              linear-gradient(90deg, transparent 0 56px, rgba(255,255,255,.12) 56px 57px, transparent 57px),
              linear-gradient(160deg, var(--hero) 0%, var(--hero-2) 100%);
  border-radius: 0 0 28px 28px; }
.login::after { content: "PIF"; position: absolute; right: -18px; top: 6%; z-index: -1; font: 800 clamp(120px, 26vw, 240px)/1 var(--font); letter-spacing: -0.06em; color: rgba(255,255,255,.06); pointer-events: none; }
.lg { width: 100%; max-width: 420px; display: grid; gap: 18px; }
.lg-brand { display: flex; align-items: center; gap: 12px; padding: 0 4px; color: var(--hero-ink); }
.lg-mark { width: 46px; height: 46px; border-radius: 13px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); display: grid; place-items: center; flex: none; }
.lg-mark svg { width: 24px; height: 24px; }
.lg-brand b { display: block; font-size: 20px; letter-spacing: -0.01em; }
.lg-brand span { font-size: 13.5px; color: var(--hero-sub); font-variant-numeric: tabular-nums; }
.lg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px 20px; display: grid; gap: 18px; box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 18px 48px rgba(8,40,44,.18); }
.lg-k { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.lg-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lg-roles button { display: grid; justify-items: start; gap: 2px; padding: 14px 14px 12px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; text-align: left; transition: border-color .15s, background .15s; }
.lg-roles button:not([aria-pressed="true"]):hover { border-color: var(--muted); }
.lg-roles button { position: relative; }
.lg-roles button[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft) !important; }
.lg-roles button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.lg-roles svg { width: 26px; height: 26px; margin-bottom: 6px; color: var(--muted); }
.lg-roles b { font-size: 17px; }
.lg-roles small { font-size: 12.5px; color: var(--muted); }
.lg-roles button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lg-roles button[aria-pressed="true"] svg { color: var(--accent); }
.lg-names { display: flex; flex-wrap: wrap; gap: 6px; }
.lg-names button { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 14px 5px 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 15px; font-weight: 600; }
.lg-av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; letter-spacing: -0.02em; }
.lg-names button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lg-names button[aria-pressed="true"] .lg-av { background: var(--accent); color: var(--accent-ink); }
.lg-pw { display: grid; gap: 8px; }
.lg-pw label { font-size: 13.5px; color: var(--muted); }
.lg-pw label b { color: var(--ink); }
.lg-field { position: relative; }
.lg-field .txt { min-height: 48px; padding-right: 64px; font-size: 16px; letter-spacing: .04em; }
.lg-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 13px; padding: 8px 10px; border-radius: 8px; }
.lg-eye:hover { background: var(--bg); }
.login .err { color: var(--bad); font-size: 13.5px; margin: -6px 0 0; }
.login .err:empty { display: none; }
.lg-go { min-height: 50px; font-size: 16px; }
.lg-foot { text-align: center; font-size: 12.5px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .lg-roles button { transition: none; } }

/* ---------- 원장 탭 ---------- */
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tab:hover { background: var(--bg); }
.tab[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tab .cnt { font-family: var(--mono); font-size: 11.5px; background: var(--bad); color: var(--surface); border-radius: 999px; padding: 0 6px; line-height: 17px; }
.vhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.vhead .sub { color: var(--muted); font-size: 13.5px; }
.vhead .act { flex: 0 0 auto; }
.sect { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; margin: 20px 0 8px; display: flex; gap: 8px; align-items: center; }
.sect:first-child { margin-top: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.loading { padding: 40px 8px; text-align: center; color: var(--muted); }
select.txt { appearance: auto; }
textarea.txt { resize: vertical; min-height: 64px; line-height: 1.45; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.fgrid .wide { grid-column: 1 / -1; }

/* 수업피드백 */
.lcls { margin-bottom: 18px; }
.lcls > .lhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 14px; }
.lcls .cname { font-size: 18px; font-weight: 700; }
.lcls .cstat { flex: 1 1 220px; font-size: 13px; color: var(--muted); min-width: 0; }
.lcls .lbody { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 14px; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.items button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.items button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.approve { min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.approve[aria-pressed="true"] { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.sgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; padding: 0 14px 14px; }
@media (max-width: 420px) { .sgrid { grid-template-columns: 1fr; } }
.lstu { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
.lstu.off { opacity: .62; }
.lstu .h { display: flex; gap: 8px; align-items: center; padding: 10px 12px; }
.lstu .h .name { flex: 1; font-size: 16px; min-width: 0; }
.lstu .b { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 10px; }
.lstu .tasks { grid-template-columns: 72px 1fr; }
.score { display: flex; gap: 8px; align-items: center; }
.score .txt { width: 92px; font-family: var(--mono); }
details.pv summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; }
details.pv summary::-webkit-details-marker { display: none; }
details.pv .preview { margin-top: 8px; background: var(--bg); border-radius: 9px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.st-ok { color: var(--ok); } .st-warn { color: var(--warn); } .st-mute { color: var(--muted); }

/* 변경신청 */
.req { padding: 14px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.req .rt { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.req .rt b { font-size: 16px; }
.req .when { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.req .why { font-size: 14px; overflow-wrap: anywhere; }
.req .small { font-size: 12.5px; color: var(--muted); }
.req .act { max-width: 420px; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 16px; height: 8px; border-radius: 2px; background: var(--done-soft); }
.meter i.on { background: var(--warn); }
.meter.full i.on { background: var(--bad); }
.connect { max-width: 440px; padding: 18px; display: grid; gap: 12px; }
.connect h3 { margin: 0; font-size: 17px; }
.connect p { margin: 0; color: var(--muted); font-size: 13.5px; }

/* 학생명단 · 규정 */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.toolbar .txt { width: auto; flex: 1 1 160px; max-width: 260px; }
.toolbar select.txt { flex: 0 1 130px; }
.tablewrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
table.t th, table.t td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--bg); }
table.t td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.t td.memo { white-space: normal; min-width: 160px; color: var(--muted); }
tr.quit td { color: var(--muted); }
.rform { padding: 16px; margin-bottom: 14px; display: grid; gap: 14px; border-color: var(--accent); }
.rform h3 { margin: 0; font-size: 17px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 18px; height: 18px; }
.egrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.ecard { padding: 14px; display: grid; gap: 10px; }
.ecard b { font-size: 16px; }
.ecard .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ecard .dur { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<section class="login" id="loginView" hidden>
  <div class="lg">
    <div class="lg-brand">
      <span class="lg-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <div><b>PIF 오늘 클리닉</b><span id="loginDate"></span></div>
    </div>
    <form class="lg-card" id="loginForm" autocomplete="off">
      <div class="lg-roles" role="group" aria-label="입장 구분">
        <button type="button" data-role="staff" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6"/></svg><b>조교</b><small>오늘 클리닉 입력</small></button>
        <button type="button" data-role="boss" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 12 4l8 5.5"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8M3.5 20h17"/></svg><b>원장</b><small>관리·수업피드백</small></button>
      </div>
      <div class="lg-pw" id="loginWho" hidden><span class="lg-k">이름</span><div class="lg-names" id="loginNames"></div>
        <input class="txt" id="loginName" placeholder="이름" maxlength="20" hidden></div>
      <div class="lg-pw">
        <label for="loginPw" id="loginPwLab">이름을 먼저 골라 주세요</label>
        <div class="lg-field"><input class="txt" id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호">
          <button class="lg-eye" type="button" id="loginEye" aria-label="비밀번호 보기">보기</button></div>
      </div>
      <p class="err" id="loginErr"></p>
      <button class="btn primary lg-go" id="loginBtn" type="submit" disabled>입장하기</button>
    </form>
    <p class="lg-foot">한 번 입장하면 오늘 자정까지 유지됩니다.</p>
  </div>
</section>
<header class="top" id="appTop">
  <div class="wrap">
    <div class="title-row">
      <h1 id="vtitle">오늘 클리닉</h1>
      <span class="date" id="date">—</span>
      <span class="sp"></span>
      <span class="sync" id="sync"><span class="dot"></span><span id="syncTxt">불러오는 중</span></span>
      <span class="who-chip" id="whoChip" hidden><span id="whoName"></span><button type="button" id="logout">나가기</button></span>
      <button class="iconbtn" id="reload" type="button" aria-label="새로고침">↻</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="화면" hidden>
      <button class="tab" type="button" data-v="today" aria-current="true">오늘 클리닉</button>
      <button class="tab" type="button" data-v="lesson">수업피드백</button>
      <button class="tab" type="button" data-v="req">변경신청 <span class="cnt" id="reqCnt" hidden></span></button>
      <button class="tab" type="button" data-v="roster">학생명단</button>
      <button class="tab" type="button" data-v="rule">규정·설정</button>
    </nav>
    <div id="todayTools" style="display:grid;gap:10px">
      <div class="filters" id="filters" role="group" aria-label="보기"></div>
      <input class="search" id="q" type="search" placeholder="이름·반 찾기" autocomplete="off">
    </div>
  </div>
</header>
<main id="appMain">
  <div class="wrap">
    <div class="banner" id="banner" hidden></div>
    <div id="view-today">
      <section class="notice" id="notice" hidden></section>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <div id="view-lesson" hidden></div>
    <div id="view-req" hidden></div>
    <div id="view-roster" hidden></div>
    <div id="view-rule" hidden></div>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';
  // GitHub Pages에 올릴 때만 채움: Apps Script 웹앱 주소(…/exec). 비어 있으면 구글 웹앱/미리보기로 동작
  var API_URL = 'https://script.google.com/macros/s/AKfycbwpQJ8N2ylz-deVLaAx4DI9UR7bNbmQYslKUT54qGXmegq-v-RzhmheeZcND23_-rKm/exec';
  var GAS = !API_URL && typeof google !== 'undefined' && google.script && google.script.run;
  var state = { rows: [], choices: {}, absentAfter: 10, now: '', today: '', date: '', filter: 'all', q: '', open: {}, busy: {} };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- 미리보기용 예시 데이터 (웹앱으로 열면 실제 시트를 씀) ----------
  var DEMO = !GAS && !API_URL, demoAdmin = false;
  var demo = (function () {
    var hm = function (offsetMin) { var d = new Date(Date.now() + offsetMin * 60000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
    var rows = [
      { name: '(예시) 김서윤', cls: '서울1', school: '서울고', color: '#DCEEFD', time: hm(-70), kind: '정규', att: '출석', room: '1자', todo: '워크북 Unit 7 · 어휘 재시험', wb: '완료', extra: '미완', retest: '통과', video: false, out: '', special: '', memo: '', report: '⚠️ 사유 미입력' },
      { name: '(예시) 박도윤', cls: '서초1', school: '서초고', color: '#EFE3F8', time: hm(-25), kind: '정규', att: '', room: '', todo: '실전문제 3세트', wb: '', extra: '', retest: '', video: false, out: '', special: '', memo: '', report: '' },
      { name: '(예시) 이하준', cls: '고2정시반', school: '상문고', color: '#FFCB94', time: hm(-40), kind: '변경', att: '지각', room: '2자', todo: '', wb: '완료', extra: '완료', retest: '', video: true, out: hm(-3), special: '', memo: '집중 좋았음', report: '대기' },
      { name: '(예시) 최지우', cls: '상문1', school: '상문고', color: '#FFEBD6', time: hm(20), kind: '정규', att: '', room: '', todo: '수업 과제: 독해 12~15번', wb: '', extra: '', retest: '', video: false, out: '', special: '', memo: '', report: '' },
      { name: '(예시) 정민재', cls: '서울2', school: '서울고', color: '#A9D4F7', time: hm(50), kind: '추가등원', att: '', room: '', todo: '', wb: '', extra: '', retest: '', video: false, out: '', special: '', memo: '', report: '' },
      { name: '(예시) 한유나', cls: '서초1', school: '서초고', color: '#EFE3F8', time: hm(30), kind: '취소(일정변경)', att: '', room: '', todo: '', wb: '', extra: '', retest: '', video: false, out: '', special: '', memo: '', report: '' }
    ];
    rows.forEach(function (r, i) { r.row = i + 4; r.nudge = ''; r.nudgeNote = ''; r.boss = ''; r.bossAck = ''; });
    rows[0].boss = '단어 재시험 80점 넘을 때까지 보내지 마세요.';
    rows[3].boss = '지난주 워크북 미완 → 오늘 꼭 확인';
    var notice = { text: '오늘 18시 이후 복도 청소 있어요. 하원 학생 짐 꼭 챙기게 해주세요.', acks: [] };
    var choices = { att: ['출석', '지각', '사유결석', '무단결석', '자료만수령'], room: ['1자', '1-1자', '2자'], wb: ['완료', '미완', '미지참'], extra: ['완료', '미완', '받아감'], retest: ['통과', '재시', '미실시'] };
    function find(row) { return rows.filter(function (r) { return r.row === row; })[0]; }
    return {
      apiLoginInfo: function () { return { staff: ['이서영', '손영민', '원장'], ready: true }; },
      apiLogin: function (pw, staff) { if (!pw) throw new Error('비밀번호를 입력해 주세요.'); demoAdmin = staff === '원장'; return { token: 'demo', staff: staff, admin: demoAdmin }; },
      apiGetToday: function () { return { now: hm(0), today: ymd(new Date()), date: ymd(new Date()), rows: JSON.parse(JSON.stringify(rows)), choices: choices, absentAfter: 10, user: '', admin: demoAdmin, notice: JSON.parse(JSON.stringify(notice)) }; },
      apiAckBoss: function (row) { var r = find(row); r.bossAck = auth.staff + ' ' + hm(0); return { row: JSON.parse(JSON.stringify(r)), msg: '확인했습니다.' }; },
      apiSetNotice: function (text) { notice = { text: text, acks: [] }; return JSON.parse(JSON.stringify(notice)); },
      apiAckNotice: function () { notice.acks.push(auth.staff + ' ' + hm(0)); return JSON.parse(JSON.stringify(notice)); },
      apiUpdate: function (row, name, field, value) {
        var r = find(row);
        if (field === 'out') r.out = value === 'now' ? hm(0) : ''; else r[field] = value;
        if (field === 'boss') r.bossAck = '';
        var msg = '';
        if (field === 'att' && value && r.nudge === 'wait') { r.nudge = ''; r.nudgeNote = ''; msg = '대기 중이던 미도착 알림을 취소했습니다.'; }
        return { row: JSON.parse(JSON.stringify(r)), msg: msg };
      },
      apiNudge: function (row, name, on) {
        var r = find(row);
        if (on) { r.nudge = 'wait'; r.nudgeNote = '발송 대기 (' + hm(0) + ' 체크)'; return { row: JSON.parse(JSON.stringify(r)), msg: '1~6분 뒤 학생·학부모에게 발송됩니다. 잘못 눌렀다면 지금 취소하세요.' }; }
        r.nudge = ''; r.nudgeNote = ''; return { row: JSON.parse(JSON.stringify(r)), msg: '미도착 알림을 취소했습니다.' };
      }
    };
  })();

  // ---------- 입장(공용 비밀번호) ----------
  var AUTH_FNS = { apiGetToday: 1, apiUpdate: 1, apiNudge: 1, apiAckBoss: 1, apiSetNotice: 1, apiAckNotice: 1,
    apiLessonGet: 1, apiLessonClass: 1, apiLessonStudent: 1, apiLessonAbsent: 1, apiLessonSendNow: 1,
    apiReqList: 1, apiReqConnect: 1, apiReqDecide: 1, apiRosterGet: 1, apiRosterSave: 1, apiRuleGet: 1, apiSettingsSave: 1 };
  var auth = { token: '', staff: '', admin: false };
  try { auth.token = localStorage.getItem('pif_token') || ''; auth.staff = localStorage.getItem('pif_staff') || ''; } catch (e) {}

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (AUTH_FNS[fn] && !DEMO) args.unshift(auth.token);
    return new Promise(function (resolve, reject) {
      var fail = function (err) {
        if (/LOGIN_REQUIRED/.test(errMsg(err))) { showLogin(); reject(new Error('다시 로그인해 주세요.')); }
        else reject(err);
      };
      if (DEMO) { setTimeout(function () { try { resolve(demo[fn].apply(null, args)); } catch (e) { fail(e); } }, 250); return; }
      if (API_URL) {
        fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })   // text/plain → 사전 확인 없이 바로 전송
          .then(function (res) {
            return res.text().then(function (t) {
              var j;
              try { j = JSON.parse(t); } catch (e) {
                // 구글 오류 화면 등 JSON이 아닌 응답 → 원인 파악용으로 제목·첫 줄을 보여 줌
                var m = /<title>([^<]*)<\/title>/i.exec(t), body = t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                throw new Error('서버 응답 오류 (' + res.status + '): ' + ((m && m[1]) || body).slice(0, 120) + ' [' + fn + ']');
              }
              return j;
            });
          })
          .then(function (j) { if (j.ok) resolve(j.data); else fail(new Error(j.error)); },
                function (err) {
                  if (/^서버 응답 오류/.test(errMsg(err).replace(/^Error:\s*/, ''))) fail(err);
                  else fail(new Error('서버에 연결하지 못했습니다 [' + fn + ']. 인터넷 연결을 확인하고 ↻를 눌러 주세요.'));
                });
        return;
      }
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(fail);
      runner[fn].apply(runner, args);
    });
  }

  var pickedName = '';
  function showLogin() {
    auth.token = ''; auth.admin = false;
    try { localStorage.removeItem('pif_token'); } catch (e) {}
    if (window.PIFADM) PIFADM.reset();
    $('appTop').hidden = true; $('appMain').hidden = true; $('loginView').hidden = false;
    pickedName = auth.staff;
    var td = new Date();
    $('loginDate').textContent = (td.getMonth() + 1) + '월 ' + td.getDate() + '일 (' + DOW[td.getDay()] + ')';
    call('apiLoginInfo').then(function (info) {
      var all = info.staff || [];
      var names = all.filter(function (n) { return n !== '원장'; });
      $('loginName').hidden = names.length > 0;
      if (!names.length && pickedName !== '원장') $('loginName').value = pickedName;
      $('loginNames').innerHTML = names.map(function (n) {
        var ini = n.length >= 3 ? n.slice(-2) : n.slice(0, 2);
        return '<button type="button" data-n="' + esc(n) + '" aria-pressed="false"><span class="lg-av">' + esc(ini) + '</span>' + esc(n) + '</button>';
      }).join('');
      $('loginName').hidden = true;   // 조교는 이름 없이 '조교'로 입장
      if (pickedName === '원장') role('boss');
      else if (pickedName) role('staff');
      else role('');
      if (!info.ready) $('loginErr').textContent = '원장님이 아직 앱 비밀번호를 정하지 않았습니다.';
    }).catch(function (err) { $('loginErr').textContent = errMsg(err); });
  }
  function showApp() {
    $('loginView').hidden = true; $('appTop').hidden = false; $('appMain').hidden = false;
    $('whoChip').hidden = !auth.staff; $('whoName').textContent = auth.staff;
  }
  var loginRole = '';
  function role(r) {
    loginRole = r;
    Array.prototype.forEach.call(document.querySelectorAll('.lg-roles button'), function (x) { x.setAttribute('aria-pressed', x.dataset.role === r); });
    $('loginWho').hidden = true;
    pickedName = r === 'boss' ? '원장' : r === 'staff' ? '조교' : '';
    pick(pickedName);
  }
  function pick(n) {
    pickedName = n || '';
    Array.prototype.forEach.call(document.querySelectorAll('#loginNames [data-n]'), function (x) { x.setAttribute('aria-pressed', x.dataset.n === pickedName); });
    var ready = !!loginRole;
    $('loginPwLab').innerHTML = !loginRole ? '조교인지 원장인지 먼저 골라 주세요'
      : loginRole === 'boss' ? '<b>원장</b> 비밀번호' : '<b>조교</b> 공용 비밀번호';
    $('loginBtn').disabled = !ready;
    $('loginErr').textContent = '';
  }
  $('loginForm').addEventListener('click', function (ev) {
    var r = ev.target.closest('button[data-role]');
    if (r) { role(r.dataset.role); $('loginPw').focus(); return; }
    var b = ev.target.closest('button[data-n]'); if (!b) return;
    pick(b.dataset.n); $('loginPw').focus();
  });
  $('loginEye').addEventListener('click', function () {
    var p = $('loginPw'), show = p.type === 'password';
    p.type = show ? 'text' : 'password'; this.textContent = show ? '숨기기' : '보기';
    this.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기'); p.focus();
  });
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = loginRole === 'boss' ? '원장' : loginRole === 'staff' ? '조교' : '';
    if (!name) { $('loginErr').textContent = '조교인지 원장인지 골라 주세요.'; return; }
    $('loginBtn').disabled = true; $('loginErr').textContent = '';
    call('apiLogin', $('loginPw').value, name).then(function (res) {
      auth.token = res.token; auth.staff = res.staff; auth.admin = !!res.admin;
      try { localStorage.setItem('pif_token', res.token); localStorage.setItem('pif_staff', res.staff); } catch (e) {}
      $('loginPw').value = '';
      showApp(); if (window.PIFADM) PIFADM.tabs(); load(true);
    }).catch(function (err) { $('loginErr').textContent = errMsg(err).replace(/^Error:\s*/, ''); })
      .then(function () { var e = $('loginErr').textContent; pick(pickedName); $('loginErr').textContent = e; });
  });

  // ---------- 도우미 ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mins(t) { var m = /(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function key(r) { return r.row + '|' + r.name; }
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  function status(r) {
    if (r.kind === '취소(일정변경)') return { k: 'cancel', t: '취소됨', c: 's-out' };
    if (r.out) return { k: 'out', t: '하원 ' + r.out, c: 's-out' };
    if (r.att === '출석' || r.att === '지각') return { k: 'in', t: '재실', c: 's-in' };
    if (r.att) return { k: 'abs', t: r.att, c: 's-abs' };
    var t = mins(r.time), n = nowMin();
    if (t != null && n >= t + state.absentAfter) return { k: 'late', t: '미도착 +' + (n - t) + '분', c: 's-late' };

  // 같은 학생 카드의 저장은 순서대로 줄 세움 → 저장 중에도 다음 버튼이 바로 먹힘

        run('apiReqDecide', [id, '반려', memo], reqSet);
      }
    });

    // =========================== 학생명단 ===========================
    function drawRoster() {
      var RO = V.RO, ch = RO.choices, h = '';
      var q = V.rq.trim();
      var list = RO.rows.filter(function (r) {
        if (V.rcls && r.cls !== V.rcls) return false;
        if (V.rst && r.status !== V.rst) return false;
        return !q || (r.disp + ' ' + r.name + ' ' + r.phone + ' ' + r.parent).indexOf(q.replace(/-/g, '')) !== -1 || r.disp.indexOf(q) !== -1;
      });
      h += '<div class="toolbar"><input class="txt" type="search" id="rq" data-fk="rq" placeholder="이름·번호 찾기" value="' + esc(V.rq) + '">' +
        '<select class="txt" id="rcls" aria-label="반">' + opts(ch.cls, V.rcls, '전체 반') + '</select>' +
        '<select class="txt" id="rst" aria-label="상태">' + opts(ch.status, V.rst, '전체 상태') + '</select>' +
        '<button class="btn primary" type="button" id="radd" style="flex:0 0 auto">학생 추가</button></div>';
      if (V.edit) h += formHTML(V.edit, ch);
      h += '<div class="sect">' + list.length + '명</div>';
      h += '<div class="panel tablewrap"><table class="t"><thead><tr><th>표시명</th><th>반</th><th>학교</th><th>수업</th><th>클리닉</th><th>일요</th><th>학생번호</th><th>학부모번호</th><th>상태</th><th>메모</th></tr></thead><tbody>' +
        list.map(function (r) {
          return '<tr class="click' + (r.status === '퇴원' ? ' quit' : '') + '" data-row="' + r.row + '"><td><b>' + esc(r.disp) + '</b></td><td>' + esc(r.cls) + '</td><td>' + esc(r.school) + '</td><td>' + esc(r.lessonDay) + '</td>' +
            '<td class="num">' + esc(r.clinicDay) + ' ' + esc(r.clinicTime) + '</td><td class="num">' + esc(r.sunTime) + '</td><td class="num">' + esc(phone(r.phone)) + '</td><td class="num">' + esc(phone(r.parent)) + '</td>' +
            '<td><span class="pill ' + (r.status === '재원' ? 's-in' : r.status === '휴원' ? 's-late' : 's-out') + '">' + esc(r.status) + '</span>' + (r.stop ? ' <span class="chip kind">알림중지</span>' : '') + '</td><td class="memo">' + esc(r.memo) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      if (!list.length) h += '<div class="empty">해당하는 학생이 없습니다.</div>';
      paint($('view-roster'), h);
    }
    function formHTML(e, ch) {
      var isNew = !e.row;
      var sel = function (f, list, lab, blank) { return '<label class="row"><span class="lab"><span>' + lab + '</span></span><select class="txt" data-rf="' + f + '">' + opts(list, e[f], blank) + '</select></label>'; };
      var inp = function (f, lab, ph, type) { return '<label class="row"><span class="lab"><span>' + lab + '</span></span><input class="txt" data-rf="' + f + '" data-fk="rf|' + f + '" value="' + esc(e[f]) + '" placeholder="' + esc(ph || '') + '"' + (type ? ' inputmode="' + type + '"' : '') + ' maxlength="300"></label>'; };
      return '<form class="panel rform" id="rform"><h3>' + (isNew ? '새 학생 추가' : esc(e.disp) + ' 정보 수정') + '</h3><div class="fgrid">' +
        (isNew ? inp('disp', '표시명 (앱·문자에 쓰는 이름)', '동명이인은 김민준(서울)처럼') : '<div class="row"><span class="lab"><span>표시명</span><span>기록이 이어지도록 바꿀 수 없음</span></span><div class="txt" style="background:var(--done-soft)">' + esc(e.disp) + '</div></div>') +
        inp('name', '이름', '') + sel('school', ch.school, '학교', '선택') + sel('cls', ch.cls, '반', '선택') +
        sel('lessonDay', ch.day, '수업요일', '없음') + sel('clinicDay', ch.day, '클리닉요일', '없음') +
        sel('clinicTime', ch.time, '클리닉시간', '없음') + sel('sunTime', ch.time, '일요클리닉', '없음') +
        inp('phone', '학생번호', '01012345678', 'tel') + inp('parent', '학부모번호', '01012345678', 'tel') +
        sel('status', ch.status, '상태') +
        '<label class="chk" style="align-self:end;min-height:42px"><input type="checkbox" data-rf="stop"' + (e.stop ? ' checked' : '') + '> 알림 문자 중지</label>' +
        '<label class="row wide"><span class="lab"><span>메모</span></span><input class="txt" data-rf="memo" data-fk="rf|memo" value="' + esc(e.memo) + '" maxlength="300"></label>' +
        '</div><p class="note">클리닉 요일·시간을 바꾸면 내일 오늘 탭부터 반영됩니다.</p>' +
        '<div class="act"><button class="btn ghost" type="button" id="rcancel">닫기</button><button class="btn primary" type="submit">' + (isNew ? '추가' : '저장') + '</button></div></form>';
    }
    function readForm() {
      var d = Object.assign({}, V.edit);
      Array.prototype.forEach.call(document.querySelectorAll('#rform [data-rf]'), function (el) {
        d[el.dataset.rf] = el.type === 'checkbox' ? el.checked : el.value.trim();
      });
      return d;
    }
    $('view-roster').addEventListener('input', function (ev) { if (ev.target.id === 'rq') { V.rq = ev.target.value; drawRoster(); } });
    $('view-roster').addEventListener('change', function (ev) {
      if (ev.target.id === 'rcls') { V.rcls = ev.target.value; drawRoster(); }
      if (ev.target.id === 'rst') { V.rst = ev.target.value; drawRoster(); }
    });
    $('view-roster').addEventListener('click', function (ev) {
      if (ev.target.closest('#radd')) { V.edit = { row: 0, disp: '', name: '', school: '', cls: '', lessonDay: '', clinicDay: '', clinicTime: '', sunTime: '', phone: '', parent: '', status: '재원', stop: false, memo: '' }; drawRoster(); window.scrollTo(0, 0); return; }
      if (ev.target.closest('#rcancel')) { V.edit = null; drawRoster(); return; }
      var tr = ev.target.closest('tr.click');
      if (tr) { var r = V.RO.rows.filter(function (x) { return x.row === +tr.dataset.row; })[0]; V.edit = Object.assign({}, r); drawRoster(); window.scrollTo(0, 0); }
    });
    $('view-roster').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var d = readForm(), isNew = !d.row;
      if (isNew && !d.disp) { toast('표시명을 입력해 주세요.', true); return; }
      var btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
      run('apiRosterSave', [d.row || 0, d], function (res) {
        if (!res) { btn.disabled = false; return; }
        V.RO = res; V.edit = null; drawRoster(); toast(isNew ? d.disp + ' 학생을 추가했습니다.' : '저장했습니다.');
      }).then(function (r) { if (!r && btn.isConnected) btn.disabled = false; });
    });

    // =========================== 규정·설정 ===========================
    function days(a, b) {
      var p = function (s) { var m = /(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
      var x = p(a), y = p(b); return x && y ? Math.round((y - x) / 86400000) + 1 : 0;
    }
    function drawRule() {
      var RU = V.RU, lim = RU.limit, h = '';
      var list = RU.rows.filter(function (r) { return !V.ruleWarn || r.flag || r.makeup >= lim - 1 || r.change >= lim - 1; });
      h += '<div class="vhead"><span class="sub">이번 내신대비 기간 누적 · 영상보강·일정변경은 기간 내 ' + lim + '회까지</span>' +
        '<span class="act"><button class="f" type="button" id="ruleWarn" aria-pressed="' + V.ruleWarn + '">주의 학생만 <b>' + RU.rows.filter(function (r) { return r.flag || r.makeup >= lim - 1 || r.change >= lim - 1; }).length + '</b></button></span></div>';
      h += '<div class="panel tablewrap"><table class="t"><thead><tr><th>표시명</th><th>반</th><th>영상보강</th><th>일정변경</th><th>클리닉 무단결석</th><th>지각</th><th>기간</th><th>판정</th></tr></thead><tbody>' +
        list.map(function (r) {
          return '<tr><td><b>' + esc(r.disp) + '</b></td><td>' + esc(r.cls) + '</td>' +
            '<td>' + meter(Math.min(r.makeup, lim), lim) + ' <span class="num">' + r.makeup + '/' + lim + '</span></td>' +
            '<td>' + meter(Math.min(r.change, lim), lim) + ' <span class="num">' + r.change + '/' + lim + '</span></td>' +
            '<td class="num">' + r.absent + '</td><td class="num">' + r.late + '</td>' +
            '<td class="num">' + (/^20(00|99|100)/.test(r.from) || /^2100/.test(r.to) ? '<span class="st-mute">기간 미설정</span>' : mdw(r.from) + ' ~ ' + mdw(r.to)) + '</td>' +
            '<td>' + (r.flag ? '<span class="pill s-abs">' + esc(r.flag) + '</span>' : (r.makeup >= lim - 1 || r.change >= lim - 1) ? '<span class="pill s-late">주의</span>' : '<span class="pill s-in">정상</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      if (!list.length) h += '<div class="empty">해당하는 학생이 없습니다.</div>';

      h += '<div class="sect" style="margin-top:28px">내신대비 기간</div><p class="note" style="margin:-4px 0 10px">학원 내신대비 시작일 ~ 학교 시험 시작일. 바꾸면 규정현황 집계 기간과 학습실 앱의 신청 한도가 함께 바뀝니다.</p><div class="egrid">' +
        RU.exams.map(function (e) {
          var n = days(e.from, e.to);
          return '<div class="panel ecard" data-idx="' + e.idx + '"><b>' + esc(e.label) + '</b><div class="two">' +
            '<label class="row"><span class="lab"><span>내신대비 시작</span></span><input class="txt" type="date" data-ex="from" value="' + esc(e.from) + '"></label>' +
            '<label class="row"><span class="lab"><span>학교 시험 시작</span></span><input class="txt" type="date" data-ex="to" value="' + esc(e.to) + '"></label></div>' +
            '<span class="dur">' + (n > 0 ? n + '일 (' + Math.round(n / 7) + '주)' : '날짜를 넣으면 이 기간만 집계합니다') + '</span></div>';
        }).join('') + '</div>';

      h += '<div class="sect" style="margin-top:28px">반별 정규 수업 시간표</div><p class="note" style="margin:-4px 0 10px">수업 미도착 알림 기준 시간입니다. 시간을 비우면 그 반은 수업 미도착 알림을 보내지 않습니다.</p>' +
        '<div class="panel tablewrap"><table class="t" style="min-width:420px"><thead><tr><th>반</th><th>수업요일</th><th>시작시간</th></tr></thead><tbody>' +
        RU.sched.map(function (s) {
          return '<tr data-idx="' + s.idx + '"><td><b>' + esc(s.cls) + '</b></td><td><select class="txt" data-sc="day" style="width:110px">' + opts(RU.choices.day, s.day, '모든 요일') + '</select></td>' +
            '<td><select class="txt" data-sc="time" style="width:120px">' + opts(RU.choices.time, s.time, '없음') + '</select></td></tr>';
        }).join('') + '</tbody></table></div>';
      paint($('view-rule'), h);
    }
    function ruleSet(d) { if (d) { V.RU = d; drawRule(); toast('저장했습니다.'); } }
    $('view-rule').addEventListener('click', function (ev) { if (ev.target.closest('#ruleWarn')) { V.ruleWarn = !V.ruleWarn; drawRule(); } });
    $('view-rule').addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.dataset.ex) run('apiSettingsSave', ['exam', +t.closest('.ecard').dataset.idx, t.dataset.ex, t.value], ruleSet);
      if (t.dataset.sc) run('apiSettingsSave', ['sched', +t.closest('tr').dataset.idx, t.dataset.sc, t.value], ruleSet);
    });

    // 변경신청 대기 건수는 원장 로그인 시 한 번 미리 확인 (탭 옆 숫자)
    var reqPeek = false;
    window.PIFADM = {
      view: function () { return V.view; },
      reload: reload,
      tabs: function () {
        tabs();
        if (auth.admin && !reqPeek) { reqPeek = true; call('apiReqList').then(function (d) { V.Q = V.Q || d; reqCount(); }).catch(function () {}); }
      },
      reset: function () {
        V.loaded = {}; V.L = V.Q = V.RO = V.RU = null; V.edit = null; reqPeek = false;
        VIEWS.forEach(function (k) { if (k !== 'today') $('view-' + k).innerHTML = ''; });
        $('tabs').hidden = true; $('reqCnt').hidden = true;
        V.view = 'today';
        VIEWS.forEach(function (k) { $('view-' + k).hidden = k !== 'today'; });
        $('todayTools').style.display = 'grid'; $('vtitle').textContent = TITLES.today;
      }
    };
    if (V.view !== 'today') {   // 처음 열 때 지난번 탭은 원장 확인 후 복원
      var want = V.view; V.view = 'today';
      var wait = setInterval(function () { if (auth.admin) { clearInterval(wait); show(want); } }, 300);
      setTimeout(function () { clearInterval(wait); }, 15000);
    }
  })();

  if (auth.token) { showApp(); load(true); } else showLogin();
})();
</script>
</body>
</html>
